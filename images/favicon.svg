<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080C15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E879F9;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="compilerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:0.6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="chipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="alphaBlend">
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="alphaBlend" mode="overlay"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#mainGrad)" filter="url(#noise)"/>

  <!-- ========== GPU COMPUTE GRID (bottom-left quadrant) ========== -->
  <!-- Represents parallel execution units / CUDA cores / tensor cores -->
  <g opacity="0.18">
    <!-- 4x4 grid of compute units -->
    <rect x="56" y="340" width="18" height="18" rx="2" fill="#34D399" opacity="0.9"/>
    <rect x="80" y="340" width="18" height="18" rx="2" fill="#34D399" opacity="0.7"/>
    <rect x="104" y="340" width="18" height="18" rx="2" fill="#34D399" opacity="0.8"/>
    <rect x="128" y="340" width="18" height="18" rx="2" fill="#34D399" opacity="0.5"/>

    <rect x="56" y="364" width="18" height="18" rx="2" fill="#34D399" opacity="0.6"/>
    <rect x="80" y="364" width="18" height="18" rx="2" fill="#34D399" opacity="0.9"/>
    <rect x="104" y="364" width="18" height="18" rx="2" fill="#34D399" opacity="0.5"/>
    <rect x="128" y="364" width="18" height="18" rx="2" fill="#34D399" opacity="0.8"/>

    <rect x="56" y="388" width="18" height="18" rx="2" fill="#34D399" opacity="0.8"/>
    <rect x="80" y="388" width="18" height="18" rx="2" fill="#34D399" opacity="0.5"/>
    <rect x="104" y="388" width="18" height="18" rx="2" fill="#34D399" opacity="0.9"/>
    <rect x="128" y="388" width="18" height="18" rx="2" fill="#34D399" opacity="0.6"/>

    <rect x="56" y="412" width="18" height="18" rx="2" fill="#34D399" opacity="0.5"/>
    <rect x="80" y="412" width="18" height="18" rx="2" fill="#34D399" opacity="0.8"/>
    <rect x="104" y="412" width="18" height="18" rx="2" fill="#34D399" opacity="0.7"/>
    <rect x="128" y="412" width="18" height="18" rx="2" fill="#34D399" opacity="0.9"/>
  </g>

  <!-- ========== CHIP DIE / ACCELERATOR (top-right quadrant) ========== -->
  <!-- Represents the hardware accelerator / chip layout -->
  <g opacity="0.2">
    <!-- Die outline -->
    <rect x="362" y="62" width="94" height="94" rx="4" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
    
    <!-- Internal blocks (functional units on a die) -->
    <rect x="370" y="70" width="24" height="18" rx="2" fill="#38BDF8" opacity="0.5"/>
    <rect x="400" y="70" width="24" height="18" rx="2" fill="#818CF8" opacity="0.5"/>
    <rect x="430" y="70" width="18" height="18" rx="2" fill="#38BDF8" opacity="0.4"/>
    
    <rect x="370" y="94" width="18" height="24" rx="2" fill="#818CF8" opacity="0.4"/>
    <rect x="394" y="94" width="30" height="24" rx="2" fill="#38BDF8" opacity="0.35"/>
    <rect x="430" y="94" width="18" height="24" rx="2" fill="#818CF8" opacity="0.5"/>
    
    <rect x="370" y="124" width="36" height="24" rx="2" fill="#38BDF8" opacity="0.45"/>
    <rect x="412" y="124" width="36" height="24" rx="2" fill="#818CF8" opacity="0.35"/>

    <!-- Bond pads / IO pins along edges -->
    <rect x="374" y="58" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="392" y="58" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="410" y="58" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="428" y="58" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>

    <rect x="374" y="154" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="392" y="154" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="410" y="154" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="428" y="154" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>

    <rect x="356" y="76" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="356" y="94" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="356" y="112" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="356" y="130" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>

    <rect x="456" y="76" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="456" y="94" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="456" y="112" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
    <rect x="456" y="130" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
  </g>

  <!-- ========== COMPILER DATAFLOW ARROWS (top-left) ========== -->
  <!-- Represents compilation pipeline: high-level → IR → optimized → hardware -->
  <g opacity="0.2" filter="url(#chipGlow)">
    <!-- Layered brackets representing compilation stages -->
    <text x="62" y="98" font-family="monospace" font-size="14" fill="#FBBF24" opacity="0.7">{ }</text>
    <polyline points="60,108 76,118 60,128" fill="none" stroke="#FBBF24" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
    <line x1="82" y1="118" x2="110" y2="118" stroke="#FBBF24" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
    <polyline points="112,108 128,118 112,128" fill="none" stroke="#F97316" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
    <line x1="134" y1="118" x2="156" y2="118" stroke="#F97316" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
    <!-- Arrow pointing to "hardware" -->
    <polygon points="158,114 168,118 158,122" fill="#F97316" opacity="0.5"/>
  </g>

  <!-- ========== CIRCUIT TRACES (refined) ========== -->
  <g opacity="0.1">
    <!-- Horizontal bus lines -->
    <line x1="48" y1="256" x2="168" y2="256" stroke="#38BDF8" stroke-width="0.8"/>
    <line x1="344" y1="256" x2="464" y2="256" stroke="#38BDF8" stroke-width="0.8"/>
    
    <!-- Data bus traces with right-angle routing -->
    <polyline points="148,340 168,340 168,300" fill="none" stroke="#34D399" stroke-width="0.8" opacity="0.5"/>
    <polyline points="362,168 340,168 340,210" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- ========== NEURAL NETWORK NODES (refined, fewer but more impactful) ========== -->
  <g opacity="0.3" filter="url(#glow)">
    <!-- Input layer nodes (left) -->
    <circle cx="118" cy="216" r="3.5" fill="#34D399"/>
    <circle cx="118" cy="248" r="3.5" fill="#34D399"/>
    <circle cx="118" cy="280" r="3.5" fill="#34D399"/>

    <!-- Output layer nodes (right) -->
    <circle cx="394" cy="232" r="3.5" fill="#E879F9"/>
    <circle cx="394" cy="264" r="3.5" fill="#E879F9"/>

    <!-- Connections from input to hidden (implied by S) to output -->
    <line x1="118" y1="216" x2="185" y2="200" stroke="#34D399" stroke-width="0.8" opacity="0.5"/>
    <line x1="118" y1="248" x2="185" y2="230" stroke="#34D399" stroke-width="0.8" opacity="0.4"/>
    <line x1="118" y1="280" x2="185" y2="268" stroke="#34D399" stroke-width="0.8" opacity="0.5"/>
    
    <line x1="328" y1="248" x2="394" y2="232" stroke="#E879F9" stroke-width="0.8" opacity="0.5"/>
    <line x1="328" y1="280" x2="394" y2="264" stroke="#E879F9" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- ========== PARALLEL DATAFLOW STREAMS (right side, bottom) ========== -->
  <!-- Representing SIMT/SIMD parallel execution streams -->
  <g opacity="0.15">
    <line x1="380" y1="360" x2="380" y2="440" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="396" y1="350" x2="396" y2="430" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="412" y1="360" x2="412" y2="440" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="428" y1="355" x2="428" y2="435" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="444" y1="362" x2="444" y2="442" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Small arrows at bottom of streams -->
    <polygon points="377,440 380,448 383,440" fill="#818CF8" opacity="0.6"/>
    <polygon points="393,430 396,438 399,430" fill="#818CF8" opacity="0.6"/>
    <polygon points="409,440 412,448 415,440" fill="#818CF8" opacity="0.6"/>
    <polygon points="425,435 428,443 431,435" fill="#818CF8" opacity="0.6"/>
    <polygon points="441,442 444,450 447,442" fill="#818CF8" opacity="0.6"/>
  </g>

  <!-- ========== CENTRAL "S" MONOGRAM ========== -->
  <!-- The S now reads as: a signal path through an accelerator pipeline -->
  <g filter="url(#softGlow)">
    <path d="
      M 316 178
      C 316 178 324 156 298 146
      C 272 136 246 138 226 146
      C 206 154 188 172 188 198
      C 188 224 208 240 236 252
      L 276 272
      C 304 284 322 300 322 326
      C 322 352 304 368 280 376
      C 256 384 230 382 214 372
      C 198 362 192 342 192 342
    " 
    fill="none" 
    stroke="url(#accentGrad)" 
    stroke-width="30" 
    stroke-linecap="round"
    stroke-linejoin="round"
    />
  </g>

  <!-- Terminal dots (circuit pads) at S endpoints -->
  <circle cx="316" cy="178" r="9" fill="#38BDF8" filter="url(#glow)" opacity="0.9"/>
  <circle cx="192" cy="342" r="9" fill="#E879F9" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Pin extensions from terminals -->
  <line x1="316" y1="178" x2="344" y2="156" stroke="#38BDF8" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
  <line x1="192" y1="342" x2="164" y2="364" stroke="#E879F9" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
  <circle cx="344" cy="156" r="3" fill="#38BDF8" opacity="0.35"/>
  <circle cx="164" cy="364" r="3" fill="#E879F9" opacity="0.35"/>

  <!-- Small "data flowing through S" dots along the path -->
  <circle cx="226" cy="152" r="2" fill="#38BDF8" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="198" cy="198" r="2" fill="#818CF8" opacity="0.5">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="262" r="2.5" fill="#818CF8" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="312" cy="326" r="2" fill="#E879F9" opacity="0.5">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="376" r="2" fill="#E879F9" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer border -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.12"/>
</svg>
