{% include base_path %}

<!-- Dark mode: prevent flash of wrong theme -->
<script>
(function() {
  var saved = localStorage.getItem('theme');
  var theme;
  if (saved === 'dark' || saved === 'light') {
    theme = saved;
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    theme = 'dark';
  } else {
    theme = 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1a2e' : '#ffffff');
})();
function syncToggleCheckbox() {
  var cb = document.querySelector('.theme-toggle__input');
  if (cb) cb.checked = document.documentElement.getAttribute('data-theme') === 'dark';
}
function toggleDarkMode() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme');
  var next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', next === 'dark' ? '#1a1a2e' : '#ffffff');
}
document.addEventListener('DOMContentLoaded', syncToggleCheckbox);
</script>
